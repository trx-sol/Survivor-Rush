name: Build Survivor Rush Android

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf automake libtool libtool-bin libltdl-dev pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo6 cmake libffi-dev

      - name: Cache Buildozer
        uses: actions/cache@v3
        with:
          path: ~/.buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('.buildozer/android/platform/build-*') }}
          restore-keys: |
            buildozer-${{ runner.os }}-

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install buildozer

      - name: Build APK (with retry)
        env:
          BUILDOZER_WARN_ON_ROOT: "1"
        run: |
          for i in {1..3}; do
            echo "Build attempt $i..."
            buildozer -v android debug && break
            if [ $i -lt 3 ]; then
              echo "Build failed, retrying in 30 seconds..."
              sleep 30
            fi
          done

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: survivor-rush-apk
          path: bin/*.apk
          if-no-files-found: error
