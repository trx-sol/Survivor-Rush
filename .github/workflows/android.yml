name: Build Survivor Rush Android

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y     git zip unzip autoconf automake libtool libtool-bin pkg-config      zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo6    cmake libffi-dev libssl-dev libreadline-dev gettext autopoint
      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install buildozer

      - name: Build APK
        env:
          BUILDOZER_WARN_ON_ROOT: "1"
        run: |
          buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: survivor-rush-apk
          path: bin/*.apk
          if-no-files-found: error
